<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account · Jean-Claude’s Pâtisserie</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#faf6f0">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/pages/auth-pages.js"></script>
</head>
<body data-page="signup">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"></header>

  <main id="main" class="page">
    <div class="container container--auth">
      <section class="panel" aria-labelledby="auth-title">
        <h1 id="auth-title" class="panel__title panel__title--lg">Create an account</h1>
        <p class="hint">Save your details for faster checkout.</p>
        <form id="auth-form" class="form" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" class="input" autocomplete="name">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" class="input" autocomplete="username">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" class="input" autocomplete="new-password" aria-describedby="password-hint">
            <p id="password-hint" class="hint">At least 8 characters.</p>
          </div>
          <button type="submit" class="btn btn--primary btn--block">Create account</button>
        </form>
        <p class="auth-switch">Already have one? <a href="login.html" data-keep-next>Log in</a></p>
      </section>
    </div>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>
