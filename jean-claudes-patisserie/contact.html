<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visit &amp; Contact · Jean-Claude’s Pâtisserie</title>
  <meta name="description" content="Hours, directions and contact details for Jean-Claude’s Pâtisserie in Èze, France.">
  <meta name="theme-color" content="#faf6f0">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/pages/contact.js"></script>
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"></header>

  <main id="main" class="page">
    <div class="container">
      <header class="page__head">
        <p class="eyebrow">Visit</p>
        <h1 class="page__title">Come say bonjour</h1>
      </header>

      <div class="split">
        <section class="panel" aria-labelledby="contact-title">
          <h2 id="contact-title" class="panel__title">Send us a note</h2>
          <p class="hint">Questions, catering, or feedback on yesterday’s croissant. We read everything.</p>
          <form id="contact-form" class="form" novalidate>
            <div class="field">
              <label for="contact-name">Name</label>
              <input id="contact-name" name="name" class="input" autocomplete="name">
            </div>
            <div class="field">
              <label for="contact-email">Email</label>
              <input id="contact-email" name="email" type="email" class="input" autocomplete="email">
            </div>
            <div class="field">
              <label for="contact-topic">Topic</label>
              <select id="contact-topic" name="topic" class="input">
                <option>General question</option>
                <option>Catering &amp; large orders</option>
                <option>Feedback</option>
              </select>
            </div>
            <div class="field">
              <label for="contact-message">Message</label>
              <textarea id="contact-message" name="message" class="input" rows="5"></textarea>
            </div>
            <button type="submit" class="btn btn--primary">Send message</button>
          </form>
        </section>

        <aside class="visit">
          <dl class="visit__details">
            <div>
              <dt>Address</dt>
              <dd>12 Rue de la Paix<br>06360 Èze, France</dd>
            </div>
            <div>
              <dt>Hours</dt>
              <dd>Tuesday–Sunday, 7:00–18:00<br>Closed Mondays</dd>
            </div>
            <div>
              <dt>Phone</dt>
              <dd><a href="tel:+33493000000">+33 4 93 00 00 00</a></dd>
            </div>
          </dl>
          <iframe class="map" title="Map of Èze, France" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d23064.550111118813!2d7.335959074877252!3d43.72989835027591!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12cdc36149af4541%3A0x40819a5fd979c40!2s06360%20%C3%88ze%2C%20France!5e0!3m2!1sen!2sus!4v1700142819022!5m2!1sen!2sus" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>
